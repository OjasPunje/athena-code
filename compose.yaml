x-athena-service: &athena-service
  image: athena:humble
  build:
    context: .
    target: development
    args:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      BUILD_TYPE: ${BUILD_TYPE:-Release}
      ATHENA_BUILD_ZED: "0"
      INSTALL_ML: ${INSTALL_ML:-0}
  network_mode: host
  ipc: host
  environment:
    DISPLAY: ${DISPLAY:-}
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  volumes:
    - ./src:/workspace/src
    - athena-build:/workspace/build
    - athena-install:/workspace/install
    - athena-log:/workspace/log

services:
  shell:
    <<: *athena-service
    stdin_open: true
    tty: true

  simulation:
    <<: *athena-service
    profiles: [simulation]
    command:
      - ros2
      - launch
      - simulation
      - bringup.launch.py
      - headless:=${HEADLESS:-true}
      - rviz:=${RVIZ:-false}
    volumes:
      - ./src:/workspace/src
      - athena-build:/workspace/build
      - athena-install:/workspace/install
      - athena-log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  hardware:
    <<: *athena-service
    profiles: [hardware]
    privileged: true
    command: ["bash"]
    stdin_open: true
    tty: true
    volumes:
      - ./src:/workspace/src
      - athena-build:/workspace/build
      - athena-install:/workspace/install
      - athena-log:/workspace/log
      - /dev:/dev

volumes:
  athena-build:
  athena-install:
  athena-log:
